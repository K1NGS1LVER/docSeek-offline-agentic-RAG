server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match MAX_UPLOAD_BYTES in app/core/config.py (nginx default is 1 MB).
    client_max_body_size 25m;

    # SPA fallback: /app/:notebookId and friends are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker's embedded DNS. Without it nginx resolves `backend` once at
    # startup and keeps the old container IP forever — a recreated backend
    # then 502s until nginx restarts. Variables in proxy_pass force
    # per-request resolution through this resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url http://backend:8000;

    # API: strip the /api prefix, exactly like the Vite dev proxy does.
    # rewrite+break (not a proxy_pass URI) because a variable proxy_pass
    # never does prefix replacement.
    # proxy_buffering off + long read timeout: /ask and /research stream
    # typed SSE events and buffered responses would stall the stream.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (dictation /ws/transcribe).
    location /ws/ {
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
