server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match MAX_UPLOAD_BYTES in app/core/config.py (nginx default is 1 MB).
    client_max_body_size 25m;

    # SPA fallback: /app/:notebookId and friends are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: strip the /api prefix, exactly like the Vite dev proxy does.
    # proxy_buffering off + long read timeout: /ask and /research stream
    # typed SSE events and buffered responses would stall the stream.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (dictation /ws/transcribe).
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
