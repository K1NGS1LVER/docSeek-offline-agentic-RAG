# Everything runs here: backend, frontend (nginx), Ollama, SearXNG, Valkey.
# First run pulls the two custom images from Docker Hub (or builds them with
# `docker-compose build`), then model weights download once into volumes:
#   - ollama-init pulls qwen2.5:1.5b into ollama-data
#   - the embedder/reranker/whisper/kokoro pull into model-cache on first use
# UI: http://localhost:5173   API: http://localhost:8000
# All ports bind to 127.0.0.1 only — this is a local-first tool; nothing
# (Ollama, Valkey, the API) should be reachable from the LAN.

services:
  backend:
    image: k1ngs1lver/docseek-backend:latest
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DOCSEEK_DATA_DIR=/data
      - DOCSEEK_LLM_BASE_URL=http://ollama:11434/v1
      # Same interpolation as ollama-init below: one source of truth, so an
      # overridden model can't drift from what actually gets pulled.
      - DOCSEEK_LLM_MODEL=${DOCSEEK_LLM_MODEL:-qwen2.5:1.5b}
      - DOCSEEK_SEARXNG_URL=http://searxng:8080
      - DOCSEEK_VALKEY_URL=redis://valkey:6379/0
    volumes:
      # ./data is shared with the native ./run.sh mode (don't run both at once).
      # On macOS/colima bind mounts map container-root writes to the host user;
      # on a native Linux Docker host files will be root-owned.
      - ./data:/data
      - model-cache:/root/.cache
    depends_on:
      - ollama
      - valkey
      - searxng
    restart: unless-stopped

  frontend:
    image: k1ngs1lver/docseek-frontend:latest
    build: frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    # No host port on purpose: nothing outside the stack talks to Ollama, and
    # publishing 11434 collides with a host-installed Ollama daemon (the
    # container then crash-loops on bind and the whole LLM path dies).
    # Opt back in with a docker-compose.override.yml (see README).
    restart: unless-stopped

  # One-shot: waits for the Ollama daemon, then downloads the chat model.
  # The backend does NOT wait for this — the retrieval agent degrades to
  # heuristic defaults until the model lands.
  # restart: on-failure: a failed pull (network blip) is retried by Docker
  # instead of dying silently once; success exits 0 and stays down.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 2; done
        # Guard so re-running `up -d` later (or offline) is a no-op, not a failed pull.
        # Model name comes from the same compose interpolation as the backend env.
        ollama list | grep -q ${DOCSEEK_LLM_MODEL:-qwen2.5:1.5b} && exit 0
        echo "pulling ${DOCSEEK_LLM_MODEL:-qwen2.5:1.5b} (first run only, ~1 GB)..."
        ollama pull ${DOCSEEK_LLM_MODEL:-qwen2.5:1.5b} || { echo "pull failed; exiting so Docker retries"; sleep 15; exit 1; }
    restart: on-failure

  searxng:
    image: searxng/searxng:latest
    container_name: docseek-searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: docseek-valkey
    # No host port: only the backend reaches it over compose DNS.
    volumes:
      - valkey-data:/data
    restart: unless-stopped

volumes:
  valkey-data:
  model-cache:
  ollama-data:
