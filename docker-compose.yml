version: "3.8"
services:
  searxng:
    image: searxng/searxng:latest
    container_name: docseek-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: docseek-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped

volumes:
  valkey-data:

